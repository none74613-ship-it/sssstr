<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eid Mubarak Little Sister! ✨</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Background Music -->
    <audio id="bgMusic" loop preload="auto">
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <!-- Intro Screen -->
    <div id="intro-screen">
        <div class="intro-content">
            <h2 class="glowing-text">Ek Chota Sa Surprise... 🎁</h2>
            <button id="open-btn">Click To Open! ✨</button>
        </div>
    </div>

    <!-- Main Screen -->
    <div id="main-screen">
        <div id="particles-container"></div>
        
        <div class="glass-card">
            <div class="moon-icon">🌙</div>
            <h1 class="ultra-gradient-text">Eid-ul-Fitr Mubarak!</h1>
            <p class="sweet-message">
                Meri sab se pyari aur laadli behan ko buhat buhat buhat Eid Mubarak ❤️<br>
                Allah tumhein hamesha khush rakhe, aur ABD aur apko hmesha k liye aik kardein Ameen!
            </p>
            <h3 class="eidi-text"> jaldi se ab Eidi nikalo 😆💸</h3>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
